services:
  frontend:
    image: ${IMAGE_PREFIX:-kvant}/frontend:${IMAGE_TAG:-latest}
    build:
      context: ./frontend
      dockerfile: Dockerfile
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
      - API_URL=http://auth_service:8000
    restart: unless-stopped
    networks:
      - internal

  auth_service:
    image: ${IMAGE_PREFIX:-kvant}/auth_service:${IMAGE_TAG:-latest}
    build:
      context: ./service/auth_service
      dockerfile: Dockerfile
    env_file: ./service/auth_service/.env
    environment:
      - DB_HOST=${DB_HOST}
      - REDIS_URL=${REDIS_URL}
      - AUTH_COOKIE_SECURE=false
      - AUTH_COOKIE_SAMESITE=lax
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - internal

  user_service:
    image: ${IMAGE_PREFIX:-kvant}/user_service:${IMAGE_TAG:-latest}
    build:
      context: ./service/user_service
      dockerfile: Dockerfile
    env_file: ./service/user_service/.env
    environment:
      - DB_HOST=${DB_HOST}
      - DB_NAME=userdb
      - REDIS_URL=${REDIS_URL}
      - AUTH_SECRET_KEY=${AUTH_SECRET_KEY}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - internal

  product_service:
    image: ${IMAGE_PREFIX:-kvant}/product_service:${IMAGE_TAG:-latest}
    build:
      context: ./service/product_service
      dockerfile: Dockerfile
    env_file: ./service/product_service/.env
    environment:
      - DB_HOST=${DB_HOST}
      - DB_NAME=productdb
      - REDIS_URL=${REDIS_URL}
      - AUTH_SECRET_KEY=${AUTH_SECRET_KEY}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - internal

  cart_service:
    image: ${IMAGE_PREFIX:-kvant}/cart_service:${IMAGE_TAG:-latest}
    build:
      context: ./service/cart_service
      dockerfile: Dockerfile
    env_file: ./service/cart_service/.env
    environment:
      - DB_HOST=${DB_HOST}
      - DB_NAME=cartdb
      - REDIS_URL=${REDIS_URL}
      - AUTH_SECRET_KEY=${AUTH_SECRET_KEY}
      - PRODUCT_SERVICE_URL=http://product_service:8002
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - internal

  order_service:
    image: ${IMAGE_PREFIX:-kvant}/order_service:${IMAGE_TAG:-latest}
    build:
      context: ./service/order_service
      dockerfile: Dockerfile
    env_file: ./service/order_service/.env
    environment:
      - DB_HOST=${DB_HOST}
      - DB_NAME=orderdb
      - REDIS_URL=${REDIS_URL}
      - AUTH_SECRET_KEY=${AUTH_SECRET_KEY}
      - CART_SERVICE_URL=http://cart_service:8003
      - PRODUCT_SERVICE_URL=http://product_service:8002
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - internal

  payment_service:
    image: ${IMAGE_PREFIX:-kvant}/payment_service:${IMAGE_TAG:-latest}
    build:
      context: ./service/payment_service
      dockerfile: Dockerfile
    env_file: ./service/payment_service/.env
    environment:
      - DB_HOST=${DB_HOST}
      - DB_NAME=paymentdb
      - REDIS_URL=${REDIS_URL}
      - AUTH_SECRET_KEY=${AUTH_SECRET_KEY}
      - ORDER_SERVICE_URL=http://order_service:8004
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - internal

  chat_service:
    image: ${IMAGE_PREFIX:-kvant}/chat_service:${IMAGE_TAG:-latest}
    build:
      context: ./service/chat_service
      dockerfile: Dockerfile
    env_file: ./service/chat_service/.env
    environment:
      - DB_HOST=${DB_HOST}
      - DB_NAME=chatdb
      - REDIS_URL=${REDIS_URL}
      - AUTH_SECRET_KEY=${AUTH_SECRET_KEY}
      - PRODUCT_SERVICE_URL=http://product_service:8002
      - OPENAI_API_KEY=${OPENAI_API_KEY}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      product_service:
        condition: service_started
    restart: unless-stopped
    networks:
      - internal

  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-mydb}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - internal

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - internal

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - auth_service
      - user_service
      - product_service
      - cart_service
      - order_service
      - payment_service
      - chat_service
    restart: unless-stopped
    networks:
      - internal

  prometheus:
    image: prom/prometheus:v3.4.0
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=30d"
      - "--web.enable-lifecycle"
    ports:
      - "9090:9090"
    restart: unless-stopped
    networks:
      - internal

  grafana:
    image: grafana/grafana:12.0.1
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_ROOT_URL=http://localhost:3001
      - GF_ANALYTICS_REPORTING_ENABLED=false
      - GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH=/var/lib/grafana/dashboards/01_services.json
    ports:
      - "3001:3000"
    depends_on:
      - prometheus
    restart: unless-stopped
    networks:
      - internal

  node_exporter:
    image: prom/node-exporter:v1.9.1
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - "--path.procfs=/host/proc"
      - "--path.rootfs=/rootfs"
      - "--path.sysfs=/host/sys"
      - "--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)"
    restart: unless-stopped
    networks:
      - internal

  postgres_exporter:
    image: prometheuscommunity/postgres-exporter:v0.17.1
    environment:
      - DATA_SOURCE_NAME=postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@postgres:5432/postgres?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - internal

  redis_exporter:
    image: oliver006/redis_exporter:v1.73.0
    environment:
      - REDIS_ADDR=redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - internal

  nginx_exporter:
    image: nginx/nginx-prometheus-exporter:1.4.1
    command:
      - "--nginx.scrape-uri=http://nginx/stub_status"
    depends_on:
      - nginx
    restart: unless-stopped
    networks:
      - internal

volumes:
  postgres_data:
  redis_data:
  prometheus_data:
  grafana_data:

networks:
  internal:
    driver: bridge
