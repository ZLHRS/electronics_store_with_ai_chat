services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
      - API_URL=http://auth_service:8000
    restart: unless-stopped
    networks:
      - internal

  auth_service:
    build:
      context: ./service/auth_service
      dockerfile: Dockerfile
    env_file: ./service/auth_service/.env
    environment:
      - DB_HOST=${DB_HOST}
      - REDIS_URL=${REDIS_URL}
      - AUTH_COOKIE_SECURE=false
      - AUTH_COOKIE_SAMESITE=lax
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - internal

  user_service:
    build:
      context: ./service/user_service
      dockerfile: Dockerfile
    env_file: ./service/user_service/.env
    environment:
      - DB_HOST=${DB_HOST}
      - DB_NAME=userdb
      - REDIS_URL=${REDIS_URL}
      - AUTH_SECRET_KEY=${AUTH_SECRET_KEY}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - internal

  product_service:
    build:
      context: ./service/product_service
      dockerfile: Dockerfile
    env_file: ./service/product_service/.env
    environment:
      - DB_HOST=${DB_HOST}
      - DB_NAME=productdb
      - REDIS_URL=${REDIS_URL}
      - AUTH_SECRET_KEY=${AUTH_SECRET_KEY}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - internal

  cart_service:
    build:
      context: ./service/cart_service
      dockerfile: Dockerfile
    env_file: ./service/cart_service/.env
    environment:
      - DB_HOST=${DB_HOST}
      - DB_NAME=cartdb
      - REDIS_URL=${REDIS_URL}
      - AUTH_SECRET_KEY=${AUTH_SECRET_KEY}
      - PRODUCT_SERVICE_URL=http://product_service:8002
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - internal

  order_service:
    build:
      context: ./service/order_service
      dockerfile: Dockerfile
    env_file: ./service/order_service/.env
    environment:
      - DB_HOST=${DB_HOST}
      - DB_NAME=orderdb
      - REDIS_URL=${REDIS_URL}
      - AUTH_SECRET_KEY=${AUTH_SECRET_KEY}
      - CART_SERVICE_URL=http://cart_service:8003
      - PRODUCT_SERVICE_URL=http://product_service:8002
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - internal

  payment_service:
    build:
      context: ./service/payment_service
      dockerfile: Dockerfile
    env_file: ./service/payment_service/.env
    environment:
      - DB_HOST=${DB_HOST}
      - DB_NAME=paymentdb
      - REDIS_URL=${REDIS_URL}
      - AUTH_SECRET_KEY=${AUTH_SECRET_KEY}
      - ORDER_SERVICE_URL=http://order_service:8004
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - internal

  chat_service:
    build:
      context: ./service/chat_service
      dockerfile: Dockerfile
    env_file: ./service/chat_service/.env
    environment:
      - DB_HOST=${DB_HOST}
      - DB_NAME=chatdb
      - REDIS_URL=${REDIS_URL}
      - AUTH_SECRET_KEY=${AUTH_SECRET_KEY}
      - PRODUCT_SERVICE_URL=http://product_service:8002
      - OPENAI_API_KEY=${OPENAI_API_KEY}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      product_service:
        condition: service_started
    restart: unless-stopped
    networks:
      - internal

  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-mydb}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - internal

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - internal

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - auth_service
      - user_service
      - product_service
      - cart_service
      - order_service
      - payment_service
      - chat_service
    restart: unless-stopped
    networks:
      - internal

volumes:
  postgres_data:
  redis_data:

networks:
  internal:
    driver: bridge
