map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name localhost;

    resolver 127.0.0.11 valid=30s ipv6=off;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location /api/v1/users {
        set $upstream_user user_service:8001;
        proxy_pass http://$upstream_user;
    }

    location /api/v1/products {
        set $upstream_product product_service:8002;
        proxy_pass http://$upstream_product;
    }

    location /api/v1/categories {
        set $upstream_categories product_service:8002;
        proxy_pass http://$upstream_categories;
    }

    location /api/v1/brands {
        set $upstream_brands product_service:8002;
        proxy_pass http://$upstream_brands;
    }

    location /api/v1/cart {
        set $upstream_cart cart_service:8003;
        proxy_pass http://$upstream_cart;
    }

    location /api/v1/orders {
        set $upstream_orders order_service:8004;
        proxy_pass http://$upstream_orders;
    }

    location /api/v1/payments {
        set $upstream_payments payment_service:8005;
        proxy_pass http://$upstream_payments;
    }

    location /api/v1/webhooks {
        set $upstream_webhooks payment_service:8005;
        proxy_pass http://$upstream_webhooks;
    }

    location /api/v1/chat {
        set $upstream_chat chat_service:8006;
        proxy_pass http://$upstream_chat;
    }

    location /api/v1/ {
        set $upstream_auth auth_service:8000;
        proxy_pass http://$upstream_auth;
    }

    location / {
        set $upstream_frontend frontend:3000;
        proxy_pass http://$upstream_frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}
